apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ble-exporter.fullname" . }}
  labels:
    {{- include "ble-exporter.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ble-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ble-exporter.selectorLabels" . | nindent 8 }}
    spec:
      # ⚠️ BLEアクセスに必要な設定
      hostNetwork: {{ .Values.exporter.hostNetwork }}
      # privileged: true (securityContextに追加)

      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http-metrics
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          # BLEスキャンに必要なcapabilities
          securityContext:
            privileged: {{ .Values.exporter.privileged }}
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
          # MACアドレスを環境変数で渡し、Pythonコード側で読み込むように修正するのが理想
          env:
            - name: TARGET_MACS
              value: "{{ .Values.exporter.targetMacAddresses }}"